services:
  node-app:
    build:
      context: .
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      # local:remote  (lokal-dator:container)
      - "4000:4000"
    environment:
      # lägg hit ENV-variabler som containern ska se
      - MODE
      - JWT_SECRET
      - PORT
      - FRONTEND_ORIGIN
      - ACCESS_TOKEN_EXPIRES_IN
      - REFRESH_TOKEN_DAYS
      - DEV_TOKEN

